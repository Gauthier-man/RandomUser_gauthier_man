<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random User</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <section id="card-container">
      <div class="card-user">
        <h1>RandomUser</h1>
        <div class="card-content">
          <div class="profile-picture"></div>
            <div class="bar-info"></div>
          <div class="card-text">
            <div class="user_content">
              <h3 id="user_title">Nom :</h3>
              <p id="user-value">Jared Sims</p>
            </div>
            <div class="user_content">
              <h3>Genre :</h3>
              <p id="user-value">Homme</p>
            </div>
            <div class="user_content">
              <h3>Adresse mail :</h3>
              <p id="user-value">jared.sims@example.com</p>
            </div>
            <div class="user_content">
              <h3>Age :</h3>
              <p id="user-value">30 ans</p>
            </div>
            <div class="user_content">
              <h3>Adresse :</h3>
              <p id="user-value">2187 Timber Wolf Trail</p>
            </div>
            <div class="user_content">
            <h3>Numéro de téléphone :</h3>
            <p id="user-value">(543) 931-0478</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
