<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random User</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="card-container">
      <div class="card-user">
        <h1>RandomUser</h1>
        <div class="card-content">
          <div class="profile-picture"></div>
          <div class="bar-info"></div>
          <div class="card-text">
            <div class="user_content">
              <h3 id="user_name">Nom :</h3>
              <p id="name">Jared Sims</p>
            </div>
            <div class="user_content">
              <h3 id="user_gender">Genre :</h3>
              <p id="gender">Homme</p>
            </div>
            <div class="user_content">
              <h3 id="user_mail">Adresse mail :</h3>
              <p id="mail">jared.sims@example.com</p>
            </div>
            <div class="user_content">
              <h3 id="user_age">Age :</h3>
              <p id="age">30 ans</p>
            </div>
            <div class="user_content">
              <h3 id="user_adress">Adresse :</h3>
              <p id="adress">2187 Timber Wolf Trail</p>
            </div>
            <div class="user_content">
              <h3 id="user_number">Numéro de téléphone :</h3>
              <p id="number">(543) 931-0478</p>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
